name: Update TUSUR Schedule

on:
  schedule:
    # Runs daily at 21:00 UTC (which is 04:00 Tomsk time, Asia/Tomsk UTC+7)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      all_weeks:
        description: 'Parse all weeks of the semester (--all-weeks)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        run: |
          if [ "${{ inputs.all_weeks }}" = "true" ]; then
            python parser.py --all-weeks
          else
            python parser.py
          fi

      - name: Verify schedule.ics artifact
        run: |
          if [ ! -f schedule.ics ]; then
            echo "Error: schedule.ics was not generated!"
            exit 1
          fi
          echo "schedule.ics size: $(wc -c < schedule.ics) bytes"
          head -n 20 schedule.ics

      - name: Commit and push schedule.ics to main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schedule.ics
          if git diff --staged --quiet; then
            echo "No changes to schedule.ics"
          else
            git commit -m "Auto-update schedule.ics [skip ci]"
            git push origin main
          fi

      - name: Prepare GitHub Pages directory
        run: |
          mkdir -p public
          cp schedule.ics public/
          if [ -f index.html ]; then
            cp index.html public/
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          target-folder: .
          clean: true
