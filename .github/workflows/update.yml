name: Update TUSUR Schedule

on:
  schedule:
    # Runs daily at 15:00 UTC (which is 22:00 Tomsk time, Asia/Tomsk UTC+7)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      all_weeks:
        description: 'Parse all weeks of the semester (--all-weeks)'
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all_weeks }}" = "false" ]; then
            python parser.py
          else
            python parser.py --all-weeks
          fi

      - name: Verify schedule.ics artifact
        run: |
          if [ ! -f schedule.ics ]; then
            echo "Error: schedule.ics was not generated!"
            exit 1
          fi
          echo "schedule.ics size: $(wc -c < schedule.ics) bytes"
          head -n 20 schedule.ics

      - name: Inject GOOGLE_CALENDAR_ID into index.html for Pages
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          if [ -n "$GOOGLE_CALENDAR_ID" ]; then
            python -c "import os; p='index.html'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(s.replace('__GOOGLE_CALENDAR_ID__', os.environ['GOOGLE_CALENDAR_ID'].strip()))"
          fi

      - name: Prepare GitHub Pages directory
        run: |
          mkdir -p public
          cp schedule.ics public/
          if [ -f index.html ]; then
            cp index.html public/
          fi

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          target-folder: .
          clean: true
